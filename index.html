<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OmniWeb — browser in browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
    <button class="nav-btn" id="backBtn">←</button>
    <button class="nav-btn" id="fwdBtn">→</button>
    <button class="nav-btn" id="reloadBtn">⟳</button>
    <div class="addr-wrap">
        <input id="addrBar" type="text" placeholder="Search or enter URL — like Omni, but online" autocomplete="off" spellcheck="false">
        <button id="goBtn">Go</button>
    </div>
</div>
<div class="tabs" id="tabBar">
    <!-- tabs injected by JS -->
</div>
<div class="view">
    <iframe id="view" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
</div>
<script src="app.js"></script>
</body>
</html>
