<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body,html{margin:0;padding:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;}video{width:100%;height:100%;object-fit:contain;}.loader{color:#fff;font-family:sans-serif;position:absolute;}</style>
</head>
<body>
<div id="loader" class="loader">Resolving secure stream...</div>
<video id="player" controls autoplay playsinline></video>
<script>
let tg = window.Telegram.WebApp; tg.expand();
const token = new URLSearchParams(window.location.search).get('token');
const loader = document.getElementById('loader');
const video = document.getElementById('player');
if(!token) { loader.innerText = "Error: Missing token."; } else {
  fetch(`/api/resolve?token=${token}`).then(r => r.json()).then(data => {
    if(data.stream_url) {
      if(Hls.isSupported()) {
        const hls = new Hls(); hls.loadSource(data.stream_url); hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { loader.style.display='none'; video.play(); });
      } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = data.stream_url; loader.style.display='none'; video.play();
      }
    } else { loader.innerText = "Stream unavailable."; }
  }).catch(() => { loader.innerText = "Connection error."; });
}
</script>
</body>
</html>
