<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Browser & Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; font-family:sans-serif; }
  
  /* Full-screen container for the real website view */
  #browser-frame-container { width: 100%; height: 100%; position: relative; }
  iframe { width: 100%; height: 100%; border: none; background: #000; }

  /* Overlay Video Player when a scene is tapped */
  #player-container { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; position: fixed; top:0; left:0; background:#000; z-index: 9999; }
  video { width: 100%; height: 100%; object-fit: contain; }
  .loader { position: absolute; color: #fff; text-align: center; font-family: sans-serif; font-size: 14px; }
  
  /* Floating back button to return to catalog */
  #back-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 10000; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<button id="back-btn" onclick="closePlayer()">⬅ Back to Browse</button>

<!-- Live Website Browser View -->
<div id="browser-frame-container">
    <iframe id="site-frame" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>

<!-- Video Player View -->
<div id="player-container">
    <div id="loader" class="loader">Resolving secure stream...</div>
    <video id="player" controls autoplay playsinline></video>
</div>

<script>
let tg = window.Telegram.WebApp; tg.expand();
const urlParams = new URLSearchParams(window.location.search);
const network = urlParams.get('network') || 'brazzers';

const BACKEND_URL = "https://7265dm.bot-keep.xyz";

// Map networks to their actual public video homepages
const networkUrls = {
    "brazzers": "https://www.brazzers.com/videos",
    "mofos": "https://www.mofos.com/videos",
    "realitykings": "https://www.realitykings.com/videos",
    "babes": "https://www.babes.com/videos"
};

const targetSiteUrl = networkUrls[network] || networkUrls["brazzers"];
const iframe = document.getElementById('site-frame');

// Load the real site directly into the Mini App frame
iframe.src = targetSiteUrl;

// Function to trigger stream resolution when a user selects a video link
function resolveAndPlay(videoUrl) {
    document.getElementById('player-container').style.display = 'flex';
    document.getElementById('back-btn').style.display = 'block';
    
    fetch(`${BACKEND_URL}/api/resolve-direct?url=${encodeURIComponent(videoUrl)}`)
        .then(r => r.json())
        .then(data => {
            if(data.stream_url) {
                initPlayer(data.stream_url);
            } else {
                document.getElementById('loader').innerText = "Stream unavailable.";
            }
        })
        .catch(() => { document.getElementById('loader').innerText = "Connection error extracting stream."; });
}

function initPlayer(streamUrl) {
    const video = document.getElementById('player');
    const loader = document.getElementById('loader');
    if(Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { loader.style.display='none'; video.play(); });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        loader.style.display='none';
        video.play();
    }
}

function closePlayer() {
    const video = document.getElementById('player');
    video.pause();
    video.src = "";
    document.getElementById('player-container').style.display = 'none';
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('loader').style.display = 'block';
    document.getElementById('loader').innerText = "Resolving secure stream...";
}
</script>
</body>
</html>
